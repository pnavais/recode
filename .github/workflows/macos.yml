name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    name: build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Check architecture
      run: |
        uname -m
        test "$(uname -m)" = "${{ matrix.arch }}"
    # Use setup-python rather than Homebrew's python: the Intel runner image
    # ships a python.org framework whose /usr/local/bin links make
    # `brew install python@3.12` fail at the link step.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install setuptools cython
        brew install libtool autoconf automake help2man flex texinfo gettext m4 gnu-tar
        # Homebrew lives in /opt/homebrew on Apple silicon and /usr/local on
        # Intel, so derive every path from brew --prefix.
        prefix=$(brew --prefix)
        echo "$prefix/opt/gnu-tar/libexec/gnubin:$prefix/opt/flex/bin:$prefix/opt/m4/bin:$prefix/opt/texinfo/bin:$prefix/opt/gettext/bin" >> $GITHUB_PATH
        echo "LDFLAGS=-L$prefix/opt/flex/lib -L$prefix/opt/gettext/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I$prefix/opt/flex/include" >> $GITHUB_ENV
    - name: Bootstrap and configure
      run: |
        ./bootstrap
        ./configure --enable-silent-rules
    - name: Build
      run: make -j"$(sysctl -n hw.ncpu)"
    - name: Test
      run: make check
